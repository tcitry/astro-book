name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use a supported npm CLI for trusted publishing
        run: npm install --global npm@11.12.1
      - name: Check the selected release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('packages/astro-book/package.json', 'utf8'));
          assert.equal(pkg.name, 'astro-book');
          assert.equal(pkg.version, process.env.RELEASE_VERSION, 'Selected version must match the checked-out package');
          JS
      - run: npm ci
      - run: npm run release:check
      - name: Publish the verified package using OIDC
        run: npm run release:publish -- --provenance
