name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Optional version assertion (defaults to package.json)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use a supported npm CLI for trusted publishing
        run: npm install --global npm@11.12.1
      - name: Check whether this version needs publishing
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-status.mjs
      - run: npm ci
        if: steps.release.outputs.publish == 'true'
      - run: npm run release:check
        if: steps.release.outputs.publish == 'true'
      - name: Publish the verified package using OIDC
        if: steps.release.outputs.publish == 'true'
        run: npm run release:publish -- --provenance
