name: Public package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-consumer-report
          path: .artifacts/packed-consumer.json
          if-no-files-found: ignore
